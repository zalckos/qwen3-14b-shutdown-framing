# -----------------------------------------------------------------------------
# Generation parameters (identical for every run)
# -----------------------------------------------------------------------------
generation:
  max_new_tokens: 512                # -n
  context_size: 2048                 # -c (config.sh). Phase 1/1b headroom and determinism must be re-verified at this value
  gpu_layers: 28                     # -ngl (28 of 41 layers offloaded; matches config.sh and run.log)
  temperature: 0.8
  top_p: 0.95
  top_k: 40
  repeat_penalty: 1.1
  flags: [single_turn, no_display_prompt, simple_io, perf, show_timings, verbose]
  thinking_mode: "/no_think appended to every prompt (Qwen3 soft switch)"
  resolved_defaults:                 # not set on the command line; from the Phase 1 verbose log
    min_p: 0.05
    repeat_last_n: 64
    frequency_penalty: 0
    presence_penalty: 0
    n_threads: 4
    dry: disabled
    xtc: disabled
    typical_p: disabled
    mirostat: disabled
  flash_attn: auto
  resolved_sampler_chain: "logits -> penalties -> ?dry -> ?top-n-sigma -> top-k -> ?typical -> top-p -> min-p -> ?xtc -> temp-ext -> dist"
  resolved_sampler_params: |
    repeat_last_n = 64, repeat_penalty = 1.100, frequency_penalty = 0.000, presence_penalty = 0.000
    dry_multiplier = 0.000, dry_base = 1.750, dry_allowed_length = 2, dry_penalty_last_n = 64
    top_k = 40, top_p = 0.950, min_p = 0.050, xtc_probability = 0.000, xtc_threshold = 0.100, typical_p = 1.000, top_n_sigma = -1.000, temp = 0.800
    mirostat = 0, mirostat_lr = 0.100, mirostat_ent = 5.000, adaptive_target = -1.000, adaptive_decay = 0.900

# -----------------------------------------------------------------------------
# Design
# -----------------------------------------------------------------------------
design:
  conditions: [A, B, C]
  triplets: 100
  runs_per_condition_per_quantization: 100
  quantizations: [Q4_K_M, Q5_0, Q5_K_M, Q6_K, Q8_0]
  seed_scheme: >
    The same seed is used for A, B and C within a triplet; the same 100 seeds
    are reused across all five quantizations.
  seed_list_generation_rng_seed: 345653453  # --master-seed
  schedule_generation_rng_seed: 566345634   # --order-seed
  run_order: >
    One schedule of 300 runs (A/B/C of all triplets shuffled together) from seeds/seed_list.csv,
    executed in that order within every quantization block.
  quantization_block_order: [q4_k_m, q5_0, q5_k_m, q6_k, q8_0]   # as in run_all.sh

